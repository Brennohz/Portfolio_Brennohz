<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Minimalist Gamepad -->
  <rect x="15" y="30" width="70" height="40" rx="20" fill="none" stroke="#a3b18a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- D-pad -->
  <line x1="28" y1="50" x2="40" y2="50" stroke="#a3b18a" stroke-width="4" stroke-linecap="round" />
  <line x1="34" y1="44" x2="34" y2="56" stroke="#a3b18a" stroke-width="4" stroke-linecap="round" />
  
  <!-- Action Buttons -->
  <circle cx="68" cy="44" r="3" fill="#a3b18a" />
  <circle cx="62" cy="50" r="3" fill="#a3b18a" />
</svg>
